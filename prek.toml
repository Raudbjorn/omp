default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "forbid-changelog"
name = "forbid CHANGELOG.md"
entry = "bash -c 'if git diff --cached --name-only --diff-filter=ACMR | grep -Eq \"(^|/)CHANGELOG\\.md$\"; then echo \"This is a fork. We do not modify CHANGELOG.md\"; exit 1; fi'"
language = "system"
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "lint-staged"
name = "lint-staged"
entry = "bunx lint-staged"
language = "system"
pass_filenames = false
stages = ["pre-commit"]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"

[[repos.hooks]]
id = "conventional-pre-commit"
stages = ["commit-msg"]
